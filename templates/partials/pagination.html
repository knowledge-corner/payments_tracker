{% load money %}
{% if page.has_other_pages %}
<nav class="d-flex justify-content-between align-items-center mt-3">
  {% if page.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="{% querystring_with page=page.previous_page_number %}"><i class="bi bi-chevron-left"></i> Newer</a>{% else %}<span></span>{% endif %}
  <span class="small text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-outline-secondary btn-sm" href="{% querystring_with page=page.next_page_number %}">Older <i class="bi bi-chevron-right"></i></a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
