{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-3">
  <a href="{% url 'dashboard:home' %}" class="btn btn-link px-0 text-body"><i class="bi bi-arrow-left fs-5"></i></a>
  <h1 class="h5 mb-0">Change password</h1>
</div>
<form method="post" novalidate style="max-width: 480px;">{% csrf_token %}
  {% include "partials/form_errors.html" %}
  <div class="card p-3">
    <p class="small text-muted mb-3">Signed in as <strong>{{ user.username }}</strong>.</p>
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
  </div>
  <div class="form-actions"><button class="btn btn-primary btn-lg-touch w-100"><i class="bi bi-check2"></i> Save new password</button></div>
</form>
{% endblock %}
