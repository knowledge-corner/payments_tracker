{% extends "base.html" %}
{% load static %}
{% block title %}Sign in · Payments Tracker{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card p-4 w-100" style="max-width: 400px;">
    <div class="text-center mb-4">
      <img src="{% static 'icons/icon-192.png' %}" width="64" height="64" class="rounded-4 mb-3" alt="">
      <h1 class="h4 mb-1">Payments Tracker</h1>
      <p class="text-muted small mb-0">Cases · Payments · Follow-ups</p>
    </div>
    {% if form.errors %}<div class="alert alert-danger py-2 small">Username or password is incorrect.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-control" id="id_username" name="username" autocomplete="username" autocapitalize="none" required autofocus value="{{ form.username.value|default:'' }}">
      </div>
      <div class="mb-4">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100 btn-lg-touch">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
