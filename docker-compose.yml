# Local testing / client trial: `docker compose up -d --build`, then open http://localhost:8010
# Uses a SQLite database stored in the "appdata" volume.
# For PostgreSQL (e.g. DigitalOcean) add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
# Values below can be overridden in a .env file next to this one (see .env.example).
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATA_DIR: /app/data
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE: ${DJANGO_SECURE:-0}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      APP_PORT: ${APP_PORT:-8010}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    volumes:
      - appdata:/app/data
    ports:
      - "${APP_PORT:-8010}:8000"

volumes:
  appdata:
